# 文件名: .github/workflows/build-microros.yml
# 描述: v58 (工具库裁剪版)
#
# 1. 继承: 保留 v57 的所有核心修复 (rcutils/client核平, Introspection/FastRTPS屏蔽, Ping/Time保留)。
# 2. 新增修复: 解决 "micro_ros_utilities" 编译失败问题。
#    原因: 该库依赖 rosidl_typesupport_introspection (自省库) 来实现自动内存分配。
#    但我们为了切断 FastRTPS 依赖，已经屏蔽了自省库。这导致了 REQUIRED 依赖冲突。
# 3. 解决方案: 在 --packages-ignore 中添加 micro_ros_utilities。
#    这意味着生成的库不包含自动内存分配辅助函数。用户需在 STM32 代码中手动管理消息内存。
#    这是一个为了实现"纯净无依赖"目标的必要权衡。

name: Build micro-ROS for Cortex-M4 Hard-Float

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git cmake python3-pip gcc-arm-none-eabi

      - name: Install Python Dependencies (Fixed Versions)
        run: |
          pip3 install -U colcon-common-extensions vcstool "empy==3.3.4" lark

      - name: Set up ROS 2 Humble
        uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: humble

      - name: Create, Build and Package micro-ROS
        shell: bash
        run: |
          # 锁定根目录
          PROJECT_ROOT=$(pwd)
          
          source /opt/ros/humble/setup.bash

          echo "::group::1. Prepare and build the micro_ros_setup tool"
          mkdir -p microros_ws
          cd microros_ws
          git clone -b humble https://github.com/micro-ROS/micro_ros_setup.git src/micro_ros_setup
          if [ ! -f /etc/ros/rosdep/sources.list.d/20-default.list ]; then sudo rosdep init; fi
          rosdep update
          colcon build --packages-select micro_ros_setup
          echo "::endgroup::"
          
          echo "::group::2. Download firmware sources and install their dependencies"
          source install/setup.bash
          ros2 run micro_ros_setup create_firmware_ws.sh generate_lib
          rosdep install --from-paths src --ignore-src -y --skip-keys="micro_ros_msgs" || echo "rosdep install failed but continuing build..."
          echo "::endgroup::"
          
          echo "::group::3. Configure and Build Firmware with Precise Settings"
          TOOLCHAIN_PATH="${PWD}/firmware/stm32_hardfloat.cmake" 
          echo "DIAGNOSTIC: Creating toolchain file at: ${TOOLCHAIN_PATH}"
          
          echo '# Set the target system for ARM Cortex-M4 with Hard FPU
          set(CMAKE_SYSTEM_NAME Generic)
          set(CMAKE_SYSTEM_PROCESSOR arm)
          set(CMAKE_C_COMPILER arm-none-eabi-gcc)
          set(CMAKE_CXX_COMPILER arm-none-eabi-g++)
          set(TARGET_FLAGS "-mthumb -mcpu=cortex-m4 -mfloat-abi=hard -mfpu=fpv4-sp-d16 --specs=nosys.specs")
          set(CMAKE_C_FLAGS           "${TARGET_FLAGS} -Wall -Wextra" CACHE INTERNAL "")
          set(CMAKE_CXX_FLAGS         "${TARGET_FLAGS} -Wall -Wextra" CACHE INTERNAL "") 
          set(CMAKE_ASM_FLAGS         "${TARGET_FLAGS}" CACHE INTERNAL "")
          set(CMAKE_EXE_LINKER_FLAGS  "-Wl,--gc-sections" CACHE INTERNAL "")
          ' > ${TOOLCHAIN_PATH}
          
          cd firmware/mcu_ws
          echo "DIAGNOSTIC: Changed directory to $(pwd)"

          # ====================================================================
          # STRATEGY 0: RCUTILS REPAIR
          # ====================================================================
          RCUTILS_CMAKE_FILE="uros/rcutils/CMakeLists.txt"
          echo "DIAGNOSTIC: Applying rcutils SURGICAL PATCHES..."
          sed -i '1i set(BUILD_TESTING OFF CACHE BOOL "Force Disable Testing" FORCE)' ${RCUTILS_CMAKE_FILE}
          sed -i '/src\/filesystem.c/d' ${RCUTILS_CMAKE_FILE}
          sed -i '/src\/shared_library.c/d' ${RCUTILS_CMAKE_FILE}
          sed -i '/src\/time_unix.c/d' ${RCUTILS_CMAKE_FILE}
          sed -i '/src\/process.c/d' ${RCUTILS_CMAKE_FILE}
          sed -i '/src\/env.c/d' ${RCUTILS_CMAKE_FILE}

          # ====================================================================
          # STRATEGY 1: MICRO-XRCE-DDS-CLIENT REPAIR
          # ====================================================================
          XRCE_CLIENT_PATH="eProsima/Micro-XRCE-DDS-Client"
          XRCE_TRANSPORT_H="${XRCE_CLIENT_PATH}/include/uxr/client/transport.h"
          
          echo "DIAGNOSTIC: Sanitizing header file: ${XRCE_TRANSPORT_H}..."
          sed -i '/include.*udp_transport.h/d' ${XRCE_TRANSPORT_H}
          sed -i '/include.*tcp_transport.h/d' ${XRCE_TRANSPORT_H}
          sed -i '/include.*serial_transport.h/d' ${XRCE_TRANSPORT_H}

          FILES_TO_NUKE=(
            "src/c/profile/transport/ip/udp/udp_transport.c"
            "src/c/profile/transport/ip/tcp/tcp_transport.c"
            "src/c/profile/transport/serial/serial_transport.c"
            # "src/c/util/time.c"  <-- 保留
            # "src/c/util/ping.c"  <-- 保留
          )
          echo "DIAGNOSTIC: Nuking ONLY unwanted transport source files..."
          for FILE in "${FILES_TO_NUKE[@]}"; do
            FULL_PATH="${XRCE_CLIENT_PATH}/${FILE}"
            if [ -f "$FULL_PATH" ]; then
                echo "/* Nuked */ typedef int dummy;" > "$FULL_PATH"
            fi
          done

          XRCE_CMAKE_FILE="${XRCE_CLIENT_PATH}/CMakeLists.txt"
          sed -i '1i set(UCLIENT_PROFILE_CUSTOM_TRANSPORT ON CACHE BOOL "Force Enable Custom" FORCE)' ${XRCE_CMAKE_FILE}
          sed -i '1i set(UCLIENT_PROFILE_SERIAL OFF CACHE BOOL "Force Disable Serial" FORCE)' ${XRCE_CMAKE_FILE}
          sed -i '1i set(UCLIENT_PROFILE_TCP OFF CACHE BOOL "Force Disable TCP" FORCE)' ${XRCE_CMAKE_FILE}
          sed -i '1i set(UCLIENT_PROFILE_UDP OFF CACHE BOOL "Force Disable UDP" FORCE)' ${XRCE_CMAKE_FILE}

          # ====================================================================
          # STRATEGY 2: RMW IMPLEMENTATION FIX
          # ====================================================================
          RMW_CMAKE_FILE=$(find . -name "get_default_rmw_implementation.cmake" | head -n 1)
          if [ ! -z "$RMW_CMAKE_FILE" ]; then
            echo "DIAGNOSTIC: Hijacking RMW detection logic in ${RMW_CMAKE_FILE}..."
            echo 'function(get_default_rmw_implementation _ret_var)
              set(${_ret_var} "rmw_microxrcedds" PARENT_SCOPE)
            endfunction()' > "${RMW_CMAKE_FILE}"
          fi

          # ====================================================================
          # STRATEGY 4: DEEP CLEAN
          # ====================================================================
          echo "DIAGNOSTIC: 🔥 Performing DEEP CLEAN..."
          rm -rf build/ install/ log/
          find . -name "client.config" -delete
          find . -name "CMakeCache.txt" -delete
          find . -name "CMakeFiles" -type d -exec rm -rf {} + 2>/dev/null || true

          # ====================================================================
          # BUILD (裁剪版)
          # ====================================================================
          echo "DIAGNOSTIC: Starting Final Build..."
          
          colcon build \
            --merge-install \
            --packages-ignore \
              # 忽略 FastRTPS/FastCDR 依赖链
              rosidl_typesupport_fastrtps_c \
              rosidl_typesupport_fastrtps_cpp \
              rosidl_typesupport_cpp \
              rmw_fastrtps_cpp \
              rmw_fastrtps_dynamic_cpp \
              rmw_cyclonedds_cpp \
              rmw_dds_common \
              # 忽略自省库 (Introspection)
              rosidl_typesupport_introspection_c \
              rosidl_typesupport_introspection_cpp \
              # 【v58新增】忽略依赖自省库的工具
              micro_ros_utilities \
              # 忽略不必要的库
              libyaml_vendor \
              # 忽略测试
              test_msgs \
              tracetools_test \
            --cmake-args \
              -DCMAKE_TOOLCHAIN_FILE=${TOOLCHAIN_PATH} \
              -DBUILD_TESTING=OFF \
              -DBUILD_SHARED_LIBS=OFF \
              -DRCUTILS_USE_CUSTOM_CLOCK=ON \
              -DRCUTILS_NO_FILESYSTEM=ON \
              -DUCLIENT_CUSTOM_TRANSPORT_MTU=512 \
              -DRMW_UXRCE_TRANSPORT=custom \
              -DRMW_IMPLEMENTATION=rmw_microxrcedds \
              -DROSIDL_TYPESUPPORT_C=rosidl_typesupport_microxrcedds_c \
              -DCMAKE_DISABLE_FIND_PACKAGE_rosidl_typesupport_fastrtps_c=ON \
              -DCMAKE_DISABLE_FIND_PACKAGE_rosidl_typesupport_fastrtps_cpp=ON \
              -DCMAKE_DISABLE_FIND_PACKAGE_rosidl_typesupport_introspection_c=ON \
              -DCMAKE_DISABLE_FIND_PACKAGE_rosidl_typesupport_introspection_cpp=ON \
              -DCMAKE_DISABLE_FIND_PACKAGE_rosidl_generator_py=ON \
              -DCMAKE_DISABLE_FIND_PACKAGE_rmw_fastrtps_cpp=ON \
              -DCMAKE_DISABLE_FIND_PACKAGE_rmw_fastrtps_dynamic_cpp=ON \
              -DCMAKE_DISABLE_FIND_PACKAGE_rmw_cyclonedds_cpp=ON \
              -DCMAKE_DISABLE_FIND_PACKAGE_rmw_dds_common=ON \
              --no-warn-unused-cli
          
          echo "::endgroup::"
          
          # ====================================================================
          # MERGE & PACKAGE
          # ====================================================================
          echo "::group::4. Merge and Package Artifacts"
          
          mkdir -p "$PROJECT_ROOT/export/lib"
          mkdir -p "$PROJECT_ROOT/export/include"
          
          INSTALL_LIB_DIR="install/lib"
          if [ ! -d "$INSTALL_LIB_DIR" ]; then
             echo "DIAGNOSTIC: ❌ FATAL: Install directory not found!"
             ls -R
             exit 1
          fi
          
          cd "$INSTALL_LIB_DIR"
          echo "DIAGNOSTIC: Merging static libraries in $(pwd)..."
          
          echo "create libmicroros.a" > lib.mri
          find . -maxdepth 1 -name "*.a" -print0 | while IFS= read -r -d '' file; do
              if [ "$file" != "./libmicroros.a" ]; then
                  echo "addlib $file" >> lib.mri
              fi
          done
          echo "save" >> lib.mri
          echo "end" >> lib.mri
          
          arm-none-eabi-ar -M < lib.mri
          
          if [ -f "libmicroros.a" ]; then
             echo "DIAGNOSTIC: ✅ SUCCESS! libmicroros.a created."
             
             echo "DIAGNOSTIC: 🔍 Inspecting Symbols..."
             if arm-none-eabi-nm "libmicroros.a" | grep -q "uxr_ping_agent_attempts"; then
                echo "  [OK] uxr_ping_agent_attempts FOUND (Ping enabled)."
             else
                echo "  [WARNING] uxr_ping_agent_attempts MISSING!"
             fi

             cp libmicroros.a "$PROJECT_ROOT/export/lib/"
             cd ../include
             cp -r * "$PROJECT_ROOT/export/include/"
             
             echo "DIAGNOSTIC: Artifacts packaged successfully."
          else
             echo "DIAGNOSTIC: ❌ FATAL: Failed to create libmicroros.a"
             exit 1
          fi
          echo "::endgroup::"

      - name: Upload Cortex-M4 Hard-Float Library Artifact
        uses: actions/upload-artifact@v4
        with:
          name: libmicroros-cortex-m4-hard-float
          path: export/
